# See the MatchConfig model in scripts/match.py for the model behind each section.

# How scripts/match.py interprets IGDB's data (see IgdbConfig)
[igdb]
rumble_keywords = [
    8156,   # contextual controller rumble
    50485,  # game boy player rumble support
    46206,  # nintendo ds rumble pak
    10564,  # rumble cartridge
    27048,  # rumble pak
    38907,  # rumble support
]

analog_keywords = [
    4965,   # circle pad pro support
    10740,  # gamecube
    11394,  # gamecube controller support on wii
    45794,  # n64 controller supported
    48530,  # input type - dial controls
]

ignored_age_ratings = [
    "RP",  # ESRB's "Rating Pending"
]

# Words of a tag that title-casing would misspell (see IgdbConfig.tag_spellings and tag_uppercase)
# Each regex matches one whole word, ignoring case and any punctuation around it.
tag_uppercase = [
    # Acronyms and initialisms
    'ac|ai|aol|arg|avgn|bafta|bl|bmx|bpjm|ces|covid|dc|dk|drm|ea|eb|evo|f2p|fps|gmtk|gta|igf|ip',
    'lan|lgbtq?|mfgg|mit|nsfw(_dlc|_patch)?|sfw|nft|npc|pax|pbr|qr|rc|rtc|swat|tmnt|ufo|uk|usa|wasd|wtfpl|wwe',
    'ww[12]|(?:[a-z]\.)+[a-z]',  # "WW2", "A.I.", "D.I.C.E."
    'nfl|nba|nhl', # Sports leagues
    # Genres
    '[acdjst]?rpg|mmo(rpg)?|viprpg|ccg|tcg|stg',
    # Hardware, media, and software
    'cd|dvd|vhs|hd|4k|st|\d+fps|lcd|vfd|crt|ega|cga|vga|ibm|dos|aga|ecs|ocs|xe|jx|mz|rx|yf|s1',
    'pc|tv|fm|midi|fmv|dsp|hud|ui|rom|dlc|ir|vr|vru|vmu|fx|dx|vco|seuck|scumm|sqij|mud|wad|smw|zx',
    'nes|snes|gba?|gc|ds|3ds|3dtv|n64|ps[123p]?|psn|psg1|xbla|msx|32x|c128|d20|gp2x|gp32|gx4000|j2me|mp7',
    'cnrom|(mmc|vrc)\d|sa1|spc7110|dd1|msu1|obc|fme|mxm|vt\w+',
    # Roman numerals
    'ii|iii|iv',
]

