# Platform = its actual platform type (1 is a console)
[igdb.platform_type_overrides]
47 = 1   # Virtual Console, which IGDB calls a "platform"
133 = 1  # Odyssey 2 / Videopac G7000, which IGDB calls a computer
150 = 1  # Turbografx-16/PC Engine CD, which IGDB calls a computer
377 = 1  # Plug & Play, which IGDB calls a "platform"

# ISO 3166-1 numeric country code = the name that the DAT files use instead of ISO 3166's
# (in metadat/origin, or else in their `region` fields)
[igdb.origin_overrides]
203 = "Czech Republic"  # "Czechia"
410 = "Korea"           # "South Korea"
643 = "Russia"          # "Russian Federation"
826 = "UK"
840 = "US"

# IGDB genre = the genres the DAT files call it instead (the spelling used by the most playlists' DATs)
[igdb.genre_overrides]
2 = "Point & Click"                 # "Point-and-click"
11 = "RTS"                          # "Real Time Strategy (RTS)"
13 = "Simulation"                   # "Simulator"
14 = "Sports"                       # "Sport"
16 = "Turn-based"                   # "Turn-based strategy (TBS)"
25 = "Hack and Slash / Beat'em Up"  # "Hack and slash/Beat 'em up"
26 = "Quiz"                         # "Quiz/Trivia"
35 = "Board / Card"                 # "Card & Board Game"

# IGDB release region = its name as the DAT files spell it
[igdb.release_regions]
1 = "Europe"
2 = "USA"
3 = "Australia"
4 = "New Zealand"
5 = "Japan"
6 = "China"
7 = "Asia"
8 = "World"
9 = "Korea"
10 = "Brazil"

# IGDB's name for an age rating board = which ratings of it to keep (see RatingBoard)
# IGDB release regions: 1 europe, 2 north_america, 5 japan, 8 worldwide
[igdb.rating_boards.ESRB]
field = "esrb_rating"
founded = 1994
regions = [2, 8]

[igdb.rating_boards.PEGI]
field = "pegi_rating"
founded = 2003
regions = [1, 8]

[igdb.rating_boards.CERO]
field = "cero_rating"
founded = 2002
regions = [5, 8]

# How scripts/match.py interprets Hasheous's data (see HasheousConfig)
[hasheous]
# RetroAchievements' lists of the cheated (trainer) ROMs it refuses,
# whose ROMs Hasheous also files under unrelated games:
# "A Cheated ROM" for SNES, SMD, SMS and GBA, and "Yoda Stories" (311503) for Game Boy.
ignored_games = [259657, 262753, 309866, 601955, 311503]

# Country code = the region's name as the DAT files spell it
[hasheous.regions_by_country_code]
US = "USA"
EU = "Europe"
World = "World"
GB = "United Kingdom"
UK = "United Kingdom"
KR = "Korea"
AS = "Asia"
Asia = "Asia"
asi = "Asia"
wor = "World"
MEX = "Mexico"

# How scripts/match.py reads and spells the regions that DAT files name (see RegionConfig)
[regions]
